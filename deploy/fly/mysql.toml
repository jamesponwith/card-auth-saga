# The ledger's MySQL (ADR 0007). No [services]: reachable only on Fly's private
# network, as <app>.internal:3306. The app name comes from deploy.sh (-a).
[build]
  image = "mysql:8.4"

[env]
  MYSQL_DATABASE = "cas"

[mounts]
  source = "mysql_data"
  destination = "/var/lib/mysql"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
