# Weekly vulnerability scan of main. New CVEs land without any code changing,
# so a PR gate alone would miss them until the next PR. A finding turns this
# run red, which GitHub emails to the repo's owner: fix it with a bead.
name: security

on:
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC, an hour after learn
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
