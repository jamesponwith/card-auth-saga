# Operate: probe the deployed worker's /healthz and turn sustained SLO breaches
# into `incident`-labelled issues, which learn.yml reads for change-failure rate
# and MTTR. Incidents close themselves when the target recovers.
#
# docs/slo.yml points at the Fly deployment (ADR 0007), verified live at v0.1.1
# before this schedule went on. If the deployment goes away, take the schedule
# off first: probing an address nothing serves files incidents that never close.
name: operate

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes, the template's cadence
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: operate # never two probers racing to file the same incident
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The template's canonical prober, by module path: this repo carries no copy.
      - run: go run github.com/jamesponwith/flywheel-template/tools/watch@latest -repo "$GITHUB_REPOSITORY" -slo docs/slo.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
