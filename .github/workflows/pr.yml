# Validate: no green, no merge. lint + unit (runs the ledger contract against a MySQL service too)
# + security (secrets in history, reachable known vulnerabilities).
# AI review runs locally in the pre-push hook (see lefthook.yml + docs/adr/0002), not here.
name: pr

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9

  unit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cas
          MYSQL_DATABASE: cas
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pcas"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CAS_MYSQL_DSN: root:cas@tcp(127.0.0.1:3306)/cas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # its toolchain line: the Go production builds with
      - name: secrets
        # Blocking: a committed secret is already leaked; failing loudly is the
        # only useful response.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: vulnerabilities
        # Blocking here, unlike the template's advisory step: this repo runs a
        # production ledger, and govulncheck reports only vulnerabilities the
        # code can reach. Pinned for reproducibility; it fetches the current
        # vulnerability database every run. security.yml rescans main weekly.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
