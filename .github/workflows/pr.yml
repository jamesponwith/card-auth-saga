# Validate: no green, no merge. lint + unit (in-memory) + integration (MySQL ledger contract).
# AI review runs locally in the pre-push hook (see lefthook.yml + docs/adr/0002), not here.
name: pr

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cas
          MYSQL_DATABASE: cas
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pcas"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CAS_MYSQL_DSN: root:cas@tcp(127.0.0.1:3306)/cas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -run 'TestLedger' -v ./...
