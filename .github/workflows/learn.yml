# Learn: weekly DORA-lite + agent-effectiveness snapshot committed back to the
# repo. The git history of docs/dora.json is the trend line; docs/dora.html
# renders the latest snapshot. Deploy metrics come from the production
# deployments release.yml records. Insight → new bd issues → Intent.
name: learn

on:
  schedule:
    - cron: "0 6 * * 1" # monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The template's canonical collector, by module path, as operate.yml runs
      # the prober: one copy, so every flywheel repo measures the same way.
      # Pinned, not @latest: the module proxy can serve a stale "latest" for a
      # while after a template change. Bump it deliberately.
      - run: go run github.com/jamesponwith/flywheel-template/tools/dora@v0.0.0-20261016232855-0bc108fb0070 -repo "$GITHUB_REPOSITORY" -out docs/dora.json -prs 50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/dora.json
          if ! git diff --cached --quiet; then
            git commit -m "learn: weekly DORA snapshot"
            git push
          fi
